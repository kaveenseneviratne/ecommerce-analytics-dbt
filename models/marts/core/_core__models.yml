version: 2

# Core marts: a star schema of facts and dimensions. These are the tables analysts query.

models:
  - name: fct_orders
    description: >
      One row per order, with item, payment, review and delivery metrics joined on.
      Revenue reporting should filter on `is_valid_order`.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_value
        description: Item prices plus freight, in BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_paid
        description: Sum of all payments. Can exceed order_value when card instalments carry interest.
      - name: is_valid_order
        description: False for canceled and unavailable orders.
        data_tests: [not_null]
      - name: is_delivered
        description: Status is delivered and a delivery date was recorded.
        data_tests: [not_null]
      - name: delivered_at
        data_tests:
          - not_before:
              arguments:
                other_column: purchased_at
              config:
                severity: warn
      - name: delivery_delay_days
        description: Delivery date minus promised date. Positive means late. Null if not delivered.
      - name: is_late
        description: Delivered after the promised date. Null if not delivered.
      - name: delivery_timeliness
        description: >
          Delay bucket for reporting. The numeric prefix keeps buckets in order in BI tools
          that sort alphabetically.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Not delivered", "1. 15+ days early", "2. 8-14 days early",
                         "3. 1-7 days early", "4. On the day", "5. 1-3 days late",
                         "6. 4-7 days late", "7. 8+ days late"]
      - name: customer_order_number
        description: 1 for the customer's first order, 2 for the second, and so on.
      - name: is_first_order
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(order_value - (items_value + freight_value)) < 0.01"

  - name: fct_order_items
    description: One row per item sold, with order context for seller and product analysis.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: dim_customers
    description: One row per real customer (customer_unique_id), located by their latest order.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: lifetime_value
        description: Total value of valid orders, in BRL.
      - name: is_repeat_customer
        description: More than one valid order.

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_name
        description: English category, falling back to Portuguese, then "unknown".
        data_tests: [not_null]

  - name: dim_dates
    description: Daily calendar from 2016-01-01 to 2018-12-31.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: iso_day_of_week
        description: Monday = 1 ... Sunday = 7.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

unit_tests:
  - name: test_delivery_timeliness_and_lateness
    description: >
      Lateness is judged by calendar day against the promised date. An order delivered on the
      promised day is on time, one day later is late, and undelivered orders get no lateness.
    model: fct_orders
    given:
      - input: ref('stg_olist__orders')
        rows:
          - {order_id: on_day, customer_id: c1, order_status: delivered,
             purchased_at: "2018-01-01 10:00:00", delivered_at: "2018-01-20 23:00:00",
             estimated_delivery_at: "2018-01-20 00:00:00"}
          - {order_id: late, customer_id: c1, order_status: delivered,
             purchased_at: "2018-02-01 10:00:00", delivered_at: "2018-02-21 08:00:00",
             estimated_delivery_at: "2018-02-20 00:00:00"}
          - {order_id: early, customer_id: c2, order_status: delivered,
             purchased_at: "2018-03-01 10:00:00", delivered_at: "2018-03-05 08:00:00",
             estimated_delivery_at: "2018-03-25 00:00:00"}
          - {order_id: in_transit, customer_id: c2, order_status: shipped,
             purchased_at: "2018-04-01 10:00:00", delivered_at: null,
             estimated_delivery_at: "2018-04-25 00:00:00"}
      - input: ref('stg_olist__customers')
        rows:
          - {customer_id: c1, customer_unique_id: person_a}
          - {customer_id: c2, customer_unique_id: person_b}
      - input: ref('int_order_items__aggregated_to_orders')
        rows: []
      - input: ref('int_payments__aggregated_to_orders')
        rows: []
      - input: ref('int_reviews__latest_by_order')
        rows: []
    expect:
      rows:
        - {order_id: on_day, delivery_delay_days: 0, is_late: false,
           delivery_timeliness: "4. On the day", customer_order_number: 1}
        - {order_id: late, delivery_delay_days: 1, is_late: true,
           delivery_timeliness: "5. 1-3 days late", customer_order_number: 2}
        - {order_id: early, delivery_delay_days: -20, is_late: false,
           delivery_timeliness: "1. 15+ days early", customer_order_number: 1}
        - {order_id: in_transit, delivery_delay_days: null, is_late: null,
           delivery_timeliness: "Not delivered", customer_order_number: 2}
